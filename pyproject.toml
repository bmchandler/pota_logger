[project]
name = "pota-logger"
version = "2026.10.10"
description = "A streamlined paper to digital POTA logger with ADIF export support."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
pota-logger = "pota_logger.app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# In parallel (pytest-xdist); `-n0` runs a few tests faster without it.
# Worksteal: idle workers take tests from busy ones, about 30% faster
# than the default `load` here (2026-10-10).
addopts = "-n auto --dist worksteal"
