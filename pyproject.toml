[project]
name = "pota-logger"
version = "2026.10.13.4+dev"
description = "A streamlined paper to digital POTA logger with ADIF export support."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.13"
dependencies = [
    "linkify-it-py==2.2.0",
    "markdown-it-py==4.3.0",
    "mdit-py-plugins==0.7.0",
    "mdurl==0.1.2",
    "platformdirs==4.14.8",
    "pygments==2.21.0",
    "rich==15.0.0",
    "textual==8.2.8",
    "typing-extensions==4.16.0",
]

[project.scripts]
pota-logger = "pota_logger.app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# In parallel (pytest-xdist); `-n0` runs a few tests faster without it.
# Worksteal: idle workers take tests from busy ones, about 30% faster
# than the default `load` here (2026-10-10).
addopts = "-n auto --dist worksteal"
